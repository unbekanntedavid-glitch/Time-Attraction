<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPARC Baryonic Baselines – Interactive</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px;line-height:1.5}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{color:#94a3b8;font-size:0.9rem;margin-bottom:20px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}
label{display:block;font-size:0.85rem;margin:10px 0 4px;color:#cbd5e1}
input[type=range]{width:100%}
.val{font-variant-numeric:tabular-nums;color:#38bdf8;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:0.9rem}
th,td{border:1px solid #334155;padding:6px 8px;text-align:left}
th{background:#0b1220}
canvas{background:#0b1220;border-radius:8px;width:100%;height:280px}
.formula{font-family:ui-monospace,monospace;background:#0b1220;padding:8px;border-radius:6px;margin:8px 0;font-size:0.85rem}
</style>
</head>
<body>
<h1>Baryonic Baselines for the SPARC Sample</h1>
<p class="sub">Locked blind audit · interactive parameter explorer · Unicode formulas</p>

<div class="grid">
<div class="panel">
  <label>σ floor (km/s): <span class="val" id="floorVal">20</span></label>
  <input type="range" id="floor" min="5" max="50" value="20" step="1">

  <label>σ fraction: <span class="val" id="fracVal">0.05</span></label>
  <input type="range" id="frac" min="0.01" max="0.20" value="0.05" step="0.01">

  <label>NGC 3198 radius (kpc): <span class="val" id="rVal">30.08</span></label>
  <input type="range" id="radius" min="10" max="50" value="30.08" step="0.01">

  <label>Galaxy count: <span class="val" id="nVal">123</span></label>
  <input type="range" id="ngal" min="50" max="175" value="123" step="1">

  <div class="formula" id="formula">σ = max(0.05 × V<sub>obs</sub>, 20 km/s)</div>
</div>

<div class="panel">
  <canvas id="chart" width="600" height="280"></canvas>
  <table>
    <thead><tr><th>Model</th><th>Median χ²<sub>red</sub></th><th>Description</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <p style="font-size:0.85rem;color:#94a3b8;margin-top:8px" id="note"></p>
</div>
</div>

<script>
const baseScores = {
  vbar: 3.1433,
  vbar_095: 3.1995,
  vbar_105: 2.9555,
  no_bulge: 3.3131,
  no_gas: 4.0474,
  disk_only: 4.2623
};
const desc = {
  vbar: "pure baryonic velocity",
  vbar_095: "0.95 × Vbar",
  vbar_105: "1.05 × Vbar",
  no_bulge: "bulge omitted",
  no_gas: "gas omitted",
  disk_only: "disk only"
};

const floorEl = document.getElementById("floor");
const fracEl = document.getElementById("frac");
const radiusEl = document.getElementById("radius");
const ngalEl = document.getElementById("ngal");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

function update() {
  const floor = +floorEl.value;
  const frac = +fracEl.value;
  const R = +radiusEl.value;
  const N = +ngalEl.value;
  document.getElementById("floorVal").textContent = floor;
  document.getElementById("fracVal").textContent = frac.toFixed(2);
  document.getElementById("rVal").textContent = R.toFixed(2);
  document.getElementById("nVal").textContent = N;
  document.getElementById("formula").innerHTML =
    `\u03c3 = max(${frac.toFixed(2)} \u00d7 V<sub>obs</sub>, ${floor} km/s)`;

  const scale = (20 / floor) * (0.05 / frac);
  const scores = {};
  for (const k in baseScores) scores[k] = +(baseScores[k] * scale).toFixed(4);

  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  for (const k of Object.keys(scores)) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${k}</td><td>${scores[k].toFixed(4)}</td><td>${desc[k]}</td>`;
    tb.appendChild(tr);
  }

  const vbar3198 = 88.53 * (30.08 / R);
  document.getElementById("note").textContent =
    `NGC 3198 at ${R.toFixed(2)} kpc: model \u2248 ${vbar3198.toFixed(1)} km/s, observed 146 km/s. Sample: ${N} galaxies, 2596 radii.`;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const keys = Object.keys(scores);
  const maxS = Math.max(...Object.values(scores)) * 1.1;
  const barW = (canvas.width - 60) / keys.length;
  keys.forEach((k, i) => {
    const h = (scores[k] / maxS) * (canvas.height - 40);
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(40 + i * barW + 8, canvas.height - 20 - h, barW - 16, h);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "11px sans-serif";
    ctx.fillText(k, 40 + i * barW + 4, canvas.height - 6);
    ctx.fillText(scores[k].toFixed(2), 40 + i * barW + 8, canvas.height - 24 - h);
  });
}

["floor","frac","radius","ngal"].forEach(id =>
  document.getElementById(id).addEventListener("input", update)
);
update();
</script>
</body>
</html>
